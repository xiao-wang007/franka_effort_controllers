# Controller parameters for the Panda torque-tracking experiments.
#
# Load with `rosparam load config/panda_mpc.yaml`, then create and start the
# controller in the controller manager:
#
#   rosservice call /controller_manager/load_controller \
#     "name: 'panda_torque_pd_controller_simpson'"
#   rosservice call /controller_manager/switch_controller \
#     "start_controllers: ['panda_torque_pd_controller_simpson'] \
#      stop_controllers: [] strictness: 2"
#
# The reference trajectory is NOT read from CSV files any more.  The Simpson
# controller subscribes to /reference_trajectory (trajectory_msgs/JointTrajectory)
# and publishes /trajectory_completion (std_msgs/Bool, latched), so its dead
# ref_traj_path_* entries were removed here (the old experiment path lists are
# still in git history).  panda_torque_pd_controller is the older file-based
# controller and still REQUIRES its ref_traj_path_* entries; it is not used by
# the live strike loop.

panda_mpc_torque_controller:
    type: panda_mpc/MPCTorqueController
    arm_id: panda
    joint_names:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7

panda_torque_pd_controller:
    type: panda_mpc/TorquePDController
    arm_id: panda
    joint_names:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7

    # file-based reference trajectories -- required by this older controller.
    # (The paths point at another machine's workspace; not used by the live loop.)
    ref_traj_path_h: "/home/sc19zx/catkin_ws/real_exp/3/traj_N20_hlow0.07_euler_h.csv"
    ref_traj_path_q: "/home/sc19zx/catkin_ws/real_exp/3/traj_N20_hlow0.07_euler_q.csv"
    ref_traj_path_v: "/home/sc19zx/catkin_ws/real_exp/3/traj_N20_hlow0.07_euler_v.csv"
    ref_traj_path_u: "/home/sc19zx/catkin_ws/real_exp/3/traj_N20_hlow0.07_euler_u.csv"

    # kp_gains: [150., 150., 150., 150., 150., 150., 150.]
    # kd_gains: [30., 30., 30., 30., 30., 30., 5.]

    # this set is the gains for the very first Euler N60 test
    # kp_gains: [50., 15., 15., 15., 15., 15., 15.]
    # kd_gains: [5., 5., 5., 5., 5., 5., 5.]

    # this set is consistent with simpson's case N60, 8-in-1 in the paper
    kp_gains: [40., 40., 40., 40., 40., 40., 40.]
    kd_gains: [30., 30., 30., 30., 10., 10., 5.]

    alpha: 0.99
    N: 20
    message_to_console: "Tracking with Euler, N = 20"
    use_t_varying_gains: false
    zeta: 1.0 # damping ratio
    natural_frequency: 24.0

panda_torque_pd_controller_simpson:
    type: panda_mpc/TorquePDController_Simpson
    arm_id: panda
    joint_names:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7

    # Controller gains
    kp_gains: [225.0, 350.0, 250.0, 350.0, 50.0, 25.0, 10.0]
    kd_gains: [50.0, 70.0, 50.0, 50.0, 10.0, 10.0,  5.0]
    # Other parameters
    alpha: 0.99
    N: 40
    message_to_console: "Tracking with Simpson's, N = 40"
    use_t_varying_gains: true
    zeta: 1.0 # damping ratio
    # handoff safety gate: reject a trajectory that doesn't start at q_now
    # (max |q_now - q0| in rad) or that starts with a nonzero velocity
    # (max |v0| in rad/s)
    q_start_tolerance: 0.05
    v_start_tolerance: 0.1

    # natural_frequency tuning history (kept for reference; only the
    # uncommented line is active)
    # natural_frequency: 7.0 #// 1 Hz bandwidth, not reaching down enough
    # natural_frequency: 13.0 #// 2 Hz bandwidth, power-limit reflex triggered at the beginning
    # natural_frequency: 10.0 # better, but not reaching down enough
    # natural_frequency: 11.0 # better, but not reaching down enough
    # natural_frequency: 12.0 # triggered power-limit reflex at the beginning
    # natural_frequency: 11.5 # not triggering, seems improving?
    # natural_frequency: 11.8 # triggered power-limit reflex at the beginning, not triggering when clamped torque
    # natural_frequency: 13.0 # triggered as well
    # natural_frequency: 12.5 # triggered as well

    # above are initial trials that got q0 wrong

    # natural_frequency: 28. #  This is funny! 28. is too aggressive at the end, it wiggles when trying to stabilize at q_f
    # natural_frequency: 26.0  # This is very good!
    # natural_frequency: 27.0  # a bit jittery, but still not bad
    # natural_frequency: 26.5 # damn, cartesian velocity-limit trigger!
    # natural_frequency: 26.2 # reflex! ["joint_velocity_violation"]
    # natural_frequency: 25. # pretty good and smooth!
    # natural_frequency: 20. # noticeably gentler than 25. can slides farther
    # natural_frequency: 18. # tracking becomes sloppy!
    # natural_frequency: 19. # better than 18.
    # natural_frequency: 19.5 # similar to 19.
    # natural_frequency: 21. # hitting too hard, can topples

    # for exp10 and exp10.5, with maxing_em
    # natural_frequency: 19.8 # This one for exp10, Damn, ee missed the target for the case without maxing_em and it looks much gentler
    # natural_frequency: 16.0 # not touching the can
    # natural_frequency: 21.0 #
    # natural_frequency: 23.0 # this is the best and hits more accurately
    # natural_frequency: 24.0 # latest one for exp10 and exp10.5, with maxing_em

    # for extra cases to make paper video
    natural_frequency: 24.0

    # for exp11 and exp11.5, with maxing_em
    # natural_frequency: 18. # now it starts to work but the white bit touch the can pre-impact. on a second try, no engagement.
    # natural_frequency: 18.5 # no engagement preimpact, but missed the contact
    # natural_frequency: 19. # no engagement preimpact, but missed the contact as well
    # natural_frequency: 18.1 # ditto
    # natural_frequency: 17.9 # ditto
    # natural_frequency: 20.0 # ditto
    # natural_frequency: 22.0 # seems starting to engage
    # natural_frequency: 23.0 # yay, more engagement!
    # natural_frequency: 24.0 # currently settled to
    # natural_frequency: 25.0 # good

    # for exp11 and exp11.5, without maxing_em
